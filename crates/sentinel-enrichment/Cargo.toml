[package]
name = "sentinel-enrichment"
version = "0.1.0"
edition = "2021"
description = "Provider-neutral IOC enrichment types and test providers for ThreatDeck"
license = "MIT"

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
sentinel-ioc = { version = "0.1.0", path = "../sentinel-ioc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
