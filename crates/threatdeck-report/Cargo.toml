[package]
name = "threatdeck-report"
version = "0.1.0"
edition = "2021"
description = "Markdown report generation for ThreatDeck"
license = "MIT"
repository = "https://github.com/gripebomb/ThreatDeck"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
insta = { version = "1.40", features = ["yaml"] }
